<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS | Add Department</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --bg: #f1f5f9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); color: #334155; }

       
        .navbar {
            background: var(--primary);
            color: white;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 4px solid var(--accent);
            margin-bottom: 40px;
        }

        .navbar h3 { font-size: 1.1rem; letter-spacing: 1px; }
        .navbar span { font-size: 0.8rem; opacity: 0.8; background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 15px; }

        
        .container {
            max-width: 480px;
            margin: 0 auto 50px auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--primary);
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        
        form p { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #475569;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
            transition: 0.3s;
            background: #f8fafc;
        }

        input:focus {
            border-color: var(--accent);
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn { background: var(--success); color: white; }
        .submit-btn:hover { background: #16a34a; transform: translateY(-2px); }

        .cancel-btn { background: #f1f5f9; color: #64748b; border: 1px solid #cbd5e1; }
        .cancel-btn a { color: inherit; text-decoration: none; width: 100%; }
        .cancel-btn:hover { background: #e2e8f0; color: var(--primary); }

       
        .error { color: var(--danger); font-size: 0.8rem; margin-top: 5px; display: flex; align-items: center; gap: 4px; }
        
        .msg-box {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .msg-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .msg-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        
        @media(max-width: 500px){
            .container { margin: 15px; padding: 25px; }
            .navbar { padding: 1rem; }
            .navbar span { display: none; }
        }
    </style>
    <link rel="icon" type="image/png" href="https://www.shutterstock.com/image-vector/objective-icon-visual-symbol-that-600w-2629153077.jpg">
</head>
<body>

    <div class="navbar">
        <h3>🏢 EMS | Admin</h3>
        <span>Karan Bairagi</span>
    </div>

    <div class="container">
        <h2><span>🏢</span> Add Department</h2>

        {% if messages %}
            {% for message in messages %}
                <div class="msg-box {% if message.tags == 'success' %}msg-success{% else %}msg-error{% endif %}">
                    {{message}}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" novalidate>
            {% csrf_token %}

            {% for field in f %}
                <p>
                    <label for="{{ field.id_for_label }}">Department Name</label>
                    {{field}}

                    {% if field.errors %}
                        {% for error in field.errors %}
                            <div class="error">⚠️ {{error}}</div>
                        {% endfor %}
                    {% endif %}
                </p>
            {% endfor %}

            <div class="btn-group">
                <button type="submit" class="submit-btn">
                    <span>✅</span> Create Dept
                </button>
                <button type="button" class="cancel-btn">
                    <a href="{%url 'dash'%}"><span>🔙</span> Cancel</a>
                </button>
            </div>
        </form>
    </div>

</body>
</html>
